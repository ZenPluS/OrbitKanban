<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>OrbitKanban</title>
  <link rel="icon" href="app-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fonts/fonts.css">
  <script defer src="src/shared/localization/Translator.js"></script>
  <script defer src="src/shared/columns/ColumnSchema.js"></script>
  <script defer src="src/shared/columns/PlatformLinks.js"></script>
  <script defer src="src/shared/columns/RequiredFields.js"></script>
  <script defer src="src/shared/columns/ColumnLayout.js"></script>
  <script defer src="src/shared/columns/ColumnFilters.js"></script>
  <script defer src="src/shared/columns/ColumnCleanup.js"></script>
  <script defer src="src/shared/columns/ColumnValidator.js"></script>
  <script defer src="src/shared/columns/ColumnMerger.js"></script>
  <script defer src="src/shared/domain/Common.js"></script>
  <script defer src="src/shared/domain/Typography.js"></script>
  <script defer src="src/shared/domain/Limits.js"></script>
  <script defer src="src/shared/domain/TaskColumns.js"></script>
  <script defer src="src/shared/domain/TaskLayout.js"></script>
  <script defer src="src/shared/domain/ThemeCatalog.js"></script>
  <script defer src="src/shared/domain/TaskLinks.js"></script>
  <script defer src="src/shared/domain/ArchiveValidator.js"></script>
  <script defer src="src/shared/domain/DataFactory.js"></script>
  <script defer src="src/shared/domain/OrganizationTransfer.js"></script>
  <script defer src="src/shared/domain/IssueMatcher.js"></script>
  <script defer src="src/shared/domain/TaskOrder.js"></script>
  <script defer src="src/shared/graphics/ColorMath.js"></script>
  <script defer src="src/shared/graphics/ThemeGenerator.js"></script>
  <script defer src="src/shared/interop/CsvParser.js"></script>
  <script defer src="src/shared/interop/CsvImporter.js"></script>
  <script defer src="src/shared/interop/ZipWriter.js"></script>
  <script defer src="src/shared/interop/XlsxWriter.js"></script>
  <script defer src="src/shared/guide/GuideContent.js"></script>
  <script defer src="src/shared/graphics/IconLibrary.js"></script>
  <script type="module" src="src/renderer/main.js"></script>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon has-logo"><img src="app-logo.svg" alt="OrbitKanban"></div><div><strong id="brand-name">OrbitKanban</strong><small>YOUR PERSONAL WORKSPACE</small></div></div>
    <div class="organization-switcher"><span class="organization-icon" aria-hidden="true"><svg class="ico ico-violet" aria-hidden="true" focusable="false"><use href="#i-building"/></svg></span><label for="organization-select">Organization</label><select id="organization-select"></select><button id="manage-organizations" class="button small">Manage organizations</button><button id="open-browser" class="button small"><svg class="ico ico-blue" aria-hidden="true" focusable="false"><use href="#i-globe"/></svg><span class="nav-label">Open in browser</span></button></div>
    <div class="workspace-label">WORKSPACE <span>LOCAL</span></div>
    <nav id="navigation" aria-label="Main views"></nav>
    <div class="sidebar-bottom">
      <button id="guide-button" class="nav-button" title="Open the guide (F1)" aria-keyshortcuts="F1"><span class="nav-icon"><svg class="ico ico-rose" aria-hidden="true" focusable="false"><use href="#i-book"/></svg></span><span class="nav-label">Guide</span></button>
      <button id="settings-button" class="nav-button"><span class="nav-icon"><svg class="ico ico-slate" aria-hidden="true" focusable="false"><use href="#i-settings"/></svg></span><span class="nav-label">Settings</span></button>
      <div class="local-card"><span class="connection-dot"></span><div><strong>Only on your device</strong><small>Your data. Always with you.</small></div></div>
      <div class="version">PORTABLE EDITION <span id="app-version"></span></div>
    </div>
  </aside>
  <main>
    <header class="topbar"><div class="topbar-left"><button type="button" class="button subtle topbar-tool" id="sidebar-toggle" aria-controls="sidebar" aria-expanded="true" aria-keyshortcuts="Control+B" aria-label="Sidebar" title="Collapse the sidebar (Ctrl+B)"><svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-menu"/></svg></button><span class="breadcrumb">Workspace</span><span class="separator">/</span><span id="current-tab">Tasks</span></div><div class="topbar-right"><button type="button" class="button subtle topbar-tool global-search-button" id="global-search"><svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-search"/></svg><span id="global-search-label">Search</span><kbd>Ctrl K</kbd></button><button type="button" class="button subtle topbar-tool" id="undo-button" disabled aria-label="Undo (Ctrl+Z)"><svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-undo"/></svg></button><button type="button" class="button subtle topbar-tool" id="redo-button" disabled aria-label="Redo (Ctrl+Y)"><svg class="ico ico-line" aria-hidden="true" focusable="false"><use href="#i-redo"/></svg></button><span id="save-status"><i class="connection-dot"></i> Local archive</span><span class="avatar">ME</span></div></header>
    <section id="update-notice" hidden aria-label="App update">
      <span class="update-notice-icon" aria-hidden="true"></span>
      <div class="update-notice-copy" role="status" aria-live="polite"><strong id="update-notice-title"></strong><span id="update-notice-message"></span></div>
      <button type="button" class="button small" id="update-notice-open">View update</button>
      <button type="button" class="icon-button" id="update-notice-dismiss" aria-label="Dismiss update notification"></button>
    </section>
    <div id="content"></div>
    <footer><span><i class="connection-dot"></i> No cloud. No account. Everything under control.</span><button id="folder-button">Open data folder</button></footer>
  </main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
