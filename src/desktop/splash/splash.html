<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
  <title>OrbitKanban</title>
  <!-- Rendered by Chromium (Electron) and by the Windows HTML engine in IE11 mode (portable launcher): plain CSS, no custom properties.
       The colors are the default theme; splash-theme.css, written by the app, overrides them with the organization theme. -->
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #10131c; color: #edf0fa; }
    body { box-sizing: border-box; border: 1px solid #262932; font-family: "Segoe UI", sans-serif; cursor: default; -ms-user-select: none; user-select: none; -webkit-app-region: drag; }
    h1, p { margin: 0; }
    .splash { position: relative; width: 518px; height: 318px; overflow: hidden; }
    .brand { position: absolute; left: 38px; top: 36px; right: 38px; height: 60px; }
    .logo { position: absolute; left: 0; top: 0; width: 60px; height: 60px; }
    .titles { position: absolute; left: 78px; top: 7px; right: 0; }
    .name { font-size: 27px; font-weight: 700; line-height: 32px; letter-spacing: -0.3px; }
    .meta { margin-top: 2px; font-size: 12.5px; line-height: 16px; letter-spacing: 0.25px; color: #8a8d96; }
    .foot { position: absolute; left: 38px; right: 38px; bottom: 40px; }
    .status { margin-bottom: 14px; font-size: 15px; font-weight: 600; line-height: 20px; }

    /* Flat atom: three orbits drawn once, with an electron running along each one (HTML elements, which both engines animate). */
    .logo-default, .logo-custom, .logo-art, .orbit { position: absolute; left: 0; top: 0; width: 60px; height: 60px; }
    .logo-custom { display: none; background-position: center; background-repeat: no-repeat; background-size: contain; }
    .logo-badge { fill: #191d2a; }
    .logo-orbit { fill: none; stroke-width: 2.8; }
    .logo-orbit-1 { stroke: #c7d3ff; }
    .logo-orbit-2 { stroke: #b39cff; }
    .logo-orbit-3 { stroke: #b78ae8; }
    .logo-nucleus { fill: #b39cff; }
    .orbit-1 { transform: rotate(120deg); }
    .orbit-2 { transform: rotate(60deg); }
    /* x = 22.5·cos t and y = 8.9·sin t trace the 24 × 9.5 orbit of the 64-unit drawing at 60 px; the sine easing keeps the electron on the line.
       The 60° orbit runs half a turn ahead, which keeps the three electrons 120° apart around the nucleus at every moment. */
    .electron-x { position: absolute; left: 30px; top: 30px; width: 0; height: 0; animation: orbit-x 1.4s cubic-bezier(.37, 0, .63, 1) infinite alternate; }
    .logo-electron { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 3px; background: #edf0fa; animation: orbit-y 1.4s cubic-bezier(.37, 0, .63, 1) -.7s infinite alternate; }
    .orbit-2 .electron-x { animation-delay: -1.4s; }
    .orbit-2 .logo-electron { animation-delay: -2.1s; }
    @keyframes orbit-x { from { transform: translateX(-22.5px); } to { transform: translateX(22.5px); } }
    @keyframes orbit-y { from { transform: translateY(-8.9px); } to { transform: translateY(8.9px); } }

    /* Indeterminate bar: a solid segment sweeps across the track. */
    .track { position: relative; height: 4px; overflow: hidden; border-radius: 2px; background: #262932; }
    .sweep { position: absolute; left: 0; top: 0; width: 36%; height: 4px; border-radius: 2px; background: #b39cff; transform: translateX(-100%); animation: sweep 1.6s cubic-bezier(.45, 0, .25, 1) infinite; }
    @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }
    @media (prefers-reduced-motion: reduce) {
      .electron-x, .logo-electron { animation-play-state: paused; }
      .sweep { width: 100%; transform: none; animation: pulse 2.4s ease-in-out infinite; }
    }
  </style>
  <script src="splash.js"></script>
</head>
<body scroll="no">
  <div class="splash" role="main" aria-busy="true">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <div class="logo-custom"></div>
        <div class="logo-default">
          <svg class="logo-art" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="60" height="60" focusable="false">
            <circle class="logo-badge" cx="32" cy="32" r="32"/>
            <ellipse class="logo-orbit logo-orbit-1" cx="32" cy="32" rx="24" ry="9.5" transform="rotate(120 32 32)"/>
            <ellipse class="logo-orbit logo-orbit-2" cx="32" cy="32" rx="24" ry="9.5" transform="rotate(60 32 32)"/>
            <ellipse class="logo-orbit logo-orbit-3" cx="32" cy="32" rx="24" ry="9.5"/>
            <circle class="logo-nucleus" cx="32" cy="32" r="5.6"/>
          </svg>
          <div class="orbit orbit-1"><div class="electron-x"><div class="logo-electron"></div></div></div>
          <div class="orbit orbit-2"><div class="electron-x"><div class="logo-electron"></div></div></div>
          <div class="orbit orbit-3"><div class="electron-x"><div class="logo-electron"></div></div></div>
        </div>
      </div>
      <div class="titles"><h1 class="name">OrbitKanban</h1><p class="meta" id="splash-version">Portable</p></div>
    </div>
    <div class="foot">
      <p class="status" id="splash-status">Loading your workspace…</p>
      <div class="track" id="splash-progress" role="progressbar" aria-labelledby="splash-status"><div class="sweep"></div></div>
    </div>
  </div>
</body>
</html>
